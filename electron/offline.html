<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>College Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design tokens (mirrors Tailwind CSS vars used in the React app) ── */
      :root {
        color-scheme: dark;
        /* ── Anime Dark Blue / Neon Cyan — mirrors globals.css :root ── */
        --background:        #0A1428;
        --card:              #121f39;
        --foreground:        #E0E7FF;
        --muted-foreground:  #9CA3AF;
        --border:            #2a3a5a;
        --primary:           #00D9FF;
        --primary-fg:        #0A1428;
        --primary-80:        rgba(0, 217, 255, 0.80);
        --primary-60:        rgba(0, 217, 255, 0.60);
        --primary-30:        rgba(0, 217, 255, 0.30);
        --primary-20:        rgba(0, 217, 255, 0.20);
        --primary-10:        rgba(0, 217, 255, 0.10);
        --primary-5:         rgba(0, 217, 255, 0.05);
        --red:               #FF1744;
        --red-30:            rgba(255, 23, 68, 0.30);
        --red-10:            rgba(255, 23, 68, 0.10);
        --blue-info:         #00D9FF;
        --blue-info-10:      rgba(0, 217, 255, 0.12);
        /* blended card surface for divider label: lerp(#0A1428, #1a2a4a, 0.5) */
        --card-surface:      #12203a;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* matches: bg-gradient-to-br from-background via-background to-primary/5 */
        background: linear-gradient(135deg, var(--background) 0%, var(--background) 60%, #0d1e38 100%);
        color: var(--foreground);
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 1rem;
        padding: 1rem;
      }

      /* ── Page wrapper ── */
      .page { width: 100%; max-width: 28rem; }

      /* ── Header ── */
      .header { text-align: center; margin-bottom: 2rem; }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.5rem;
        background: var(--primary-10);
        border: 1px solid var(--primary-30);
        margin-bottom: 1rem;
        font-size: 1.5rem;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 1.1;
        margin: 0 0 0.5rem;
        color: var(--foreground);
      }

      .subtitle {
        font-size: 0.875rem;
        color: var(--muted-foreground);
        margin: 0;
      }

      /* ── Card ── */
      .card {
        border-radius: 0.75rem;
        border: 1px solid rgba(0, 217, 255, 0.20);
        background: var(--card);
        padding: 1.5rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0);
        display: grid;
        gap: 1.25rem;
      }

      /* ── Fields ── */
      .field { display: grid; gap: 0.5rem; }

      .label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted-foreground);
        /* matches React: no uppercase, no letter-spacing */
      }

      .input,
      .input-password {
        width: 100%;
        padding: 0.625rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--primary-30);
        background: var(--background);
        color: var(--foreground);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .input::placeholder,
      .input-password::placeholder { color: var(--muted-foreground); }
      .input:focus,
      .input-password:focus {
        border-color: var(--primary-60);
        box-shadow: 0 0 15px var(--primary-30), inset 0 0 10px var(--primary-5);
      }

      /* ── Password wrapper ── */
      .password-wrapper { position: relative; }
      .input-password { padding-right: 2.75rem; }
      .eye-btn {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-foreground);
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        font-size: 1rem;
        transition: color 0.15s;
      }
      .eye-btn:hover {
        color: var(--foreground);
        transform: translateY(-50%); /* stay centred — no lift */
      }

      /* ── Status / error boxes ── */
      .alert {
        border-radius: 0.5rem;
        border: 1px solid var(--red-30);
        background: var(--red-10);
        color: var(--red);
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }

      .status-box {
        border-radius: 0.5rem;
        border: 1px solid rgba(59, 130, 246, 0.25);
        background: var(--blue-info-10);
        color: var(--blue-info);
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }

      /* ── Button ── */
      .button {
        width: 100%;
        padding: 0.625rem 1rem;
        border-radius: 0.5rem;
        border: none;
        background: linear-gradient(90deg, var(--primary) 0%, var(--primary-80) 100%);
        color: var(--primary-fg);
        font-weight: 500;
        font-size: 0.875rem;
        cursor: pointer;
        transition: box-shadow 0.2s ease, transform 0.15s ease, opacity 0.15s;
      }
      .button:hover {
        box-shadow: 0 8px 24px var(--primary-30);
        transform: translateY(-1px);
      }
      .button:disabled { opacity: 0.50; cursor: not-allowed; }

      /* ── Divider ── */
      .divider {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .divider::before {
        content: "";
        position: absolute;
        left: 0; right: 0;
        height: 1px;
        background: var(--border);
      }
      .divider span {
        position: relative;
        padding: 0 0.5rem;
        /* use the computed card surface colour instead of an arbitrary hex */
        background: var(--card-surface);
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }

      /* ── Link row ── */
      .link-row {
        text-align: center;
        font-size: 0.875rem;
        color: var(--muted-foreground);
        margin-block: 0.25rem;
      }
      .link-row a {
        font-weight: 500;
        color: var(--primary);
        text-decoration: none;
        transition: color 0.15s;
      }
      .link-row a:hover { color: var(--primary-80); }

      /* ── Footer ── */
      .footer {
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted-foreground);
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- Header -->
      <div class="header">
        <div class="logo">📚</div>
        <h1>Planner</h1>
        <p class="subtitle">Sign in to your college planner</p>
      </div>

      <!-- Card -->
      <div class="card">
        <!-- Email -->
        <div class="field">
          <label class="label">Email Address</label>
          <input
            class="input"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <!-- Password -->
        <div class="field">
          <label class="label">Password</label>
          <div class="password-wrapper">
            <input
              id="passwordInput"
              class="input-password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="eye-btn"
              id="eyeBtn"
              onclick="togglePassword()"
              aria-label="Toggle password visibility"
            >
              <!-- Eye icon (visible by default) -->
              <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- EyeOff icon (hidden by default) -->
              <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Fake Sign In button -->
        <button class="button">Sign In</button>

        <!-- Sign-up link — now directly below the button, matching the React layout -->
        <p class="link-row">
          Don't have an account?
          <a href="#" onclick="event.preventDefault()">Create one</a>
        </p>

        <!-- Status message -->
        <div id="statusBox" class="status-box">Waiting for server…</div>
      </div>

      <p class="footer">Your data is encrypted and secure</p>
    </div>

    <script>
      /* ── password toggle ── */
      function togglePassword() {
        const inp = document.getElementById('passwordInput')
        const iconEye    = document.getElementById('iconEye')
        const iconEyeOff = document.getElementById('iconEyeOff')
        if (inp.type === 'password') {
          inp.type = 'text'
          iconEye.style.display    = 'none'
          iconEyeOff.style.display = 'block'
        } else {
          inp.type = 'password'
          iconEye.style.display    = 'block'
          iconEyeOff.style.display = 'none'
        }
      }

      /* ── backend polling ── */
      const statusBox = document.getElementById('statusBox')

      let countdownSecs = 3
      let tickInterval
      let retryTimeout

      function startCountdown() {
        countdownSecs = 3
        clearInterval(tickInterval)
        clearTimeout(retryTimeout)

        statusBox.textContent = `Server unavailable — retrying in ${countdownSecs}s…`

        tickInterval = setInterval(() => {
          countdownSecs -= 1
          if (countdownSecs > 0) {
            statusBox.textContent = `Server unavailable — retrying in ${countdownSecs}s…`
          } else {
            statusBox.textContent = 'Waiting for server…'
            clearInterval(tickInterval)
          }
        }, 1000)
      }

      async function checkServer() {
        try {
          const res = await fetch(`http://localhost:4000/?_=${Date.now()}`, {
            method: 'GET',
            cache: 'no-store',
          })
          if (res.ok) {
            clearInterval(tickInterval)
            clearTimeout(retryTimeout)
            statusBox.textContent = 'Server found — redirecting…'
            window.location.href = 'http://localhost:4000'
            return
          }
        } catch {
          startCountdown()
        }
        retryTimeout = setTimeout(checkServer, 3000)
      }

      checkServer()
    </script>
  </body>
</html>
